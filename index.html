<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#007bff" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <title>PhosGuard</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <header class="app-header">
      <h1>PhosGuard</h1>
      <button id="btn-export" class="icon-button">Export CSV</button>
    </header>

    <main class="dashboard">
      <!-- Daily Accumulation Gauges -->
      <section class="daily-summary">
        <h2>Today's Intake</h2>
        <div class="metrics-grid">
          <div class="metric-card" id="metric-phos">
            <span class="label">Phosphorus</span>
            <span class="value">0 / 1000 mg</span>
            <progress value="0" max="1000" id="prog-phos"></progress>
          </div>
          <div class="metric-card" id="metric-k">
            <span class="label">Potassium</span>
            <span class="value">0 / 3000 mg</span>
            <progress value="0" max="3000" id="prog-k"></progress>
          </div>
          <!-- Sodium Gauge -->
          <div class="metric-card" id="metric-na">
            <span class="label">Sodium</span>
            <span class="value">0 / 2300 mg</span>
            <progress value="0" max="2300" id="prog-na"></progress>
          </div>
          <!-- Protein Gauge -->
          <div class="metric-card" id="metric-pro">
            <span class="label">Protein</span>
            <span class="value">0 / 84 g</span>
            <progress value="0" max="84" id="prog-pro"></progress>
          </div>
          <!-- Fluid Gauge -->
          <div class="metric-card fluid-card" id="metric-fluid">
            <span class="label">Fluid Intake</span>
            <span class="value">0 / 1500 mL</span>
            <progress value="0" max="1500" id="prog-fluid"></progress>
          </div>
        </div>
      </section>

      <!-- Quick-Add/Subtract Fluid Buttons -->
      <section class="fluid-tracker">
        <h3>Manage Fluid</h3>
        <div class="fluid-control-group">
          <span class="fluid-label">4 oz (120 mL)</span>
          <div class="fluid-buttons">
            <button class="fluid-btn sub-btn" data-ml="-120">- Remove</button>
            <button class="fluid-btn add-btn" data-ml="120">+ Add</button>
          </div>
        </div>
        <div class="fluid-control-group" style="margin-top: 10px;">
          <span class="fluid-label">8 oz (240 mL)</span>
          <div class="fluid-buttons">
            <button class="fluid-btn sub-btn" data-ml="-240">- Remove</button>
            <button class="fluid-btn add-btn" data-ml="240">+ Add</button>
          </div>
        </div>
        <div class="fluid-control-group" style="margin-top: 10px;">
          <span class="fluid-label">16.9 oz (500 mL)</span>
          <div class="fluid-buttons">
            <button class="fluid-btn sub-btn" data-ml="-500">- Remove</button>
            <button class="fluid-btn add-btn" data-ml="500">+ Add</button>
          </div>
        </div>
      </section>

      <!-- The Scanner Viewfinder (Hidden by default) -->
      <div id="reader" style="display: none;"></div>

      <!-- Primary Action Buttons -->
      <section class="actions">
        <button id="btn-scan-ingredients" class="primary-btn warning-theme">
          Scan Ingredients (Phos-Catcher)
        </button>
        <button id="btn-scan-barcode" class="primary-btn">
          Scan Barcode
        </button>
      </section>

      <!-- The Logbook -->
      <section class="logbook">
        <h3>Today's Log</h3>
        <ul id="food-list" class="food-list">
          <!-- JS will inject <li> items here -->
        </ul>
      </section>
    </main>

    <!-- Portion Adjustment Modal (Hidden by default) -->
    <div id="portion-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3 id="modal-food-name">Product Name</h3>
        
        <div class="macro-preview">
          <p>Phos: <strong id="modal-phos">0</strong>mg | K: <strong id="modal-k">0</strong>mg</p>
          <p>Na: <strong id="modal-na">0</strong>mg | Pro: <strong id="modal-pro">0</strong>g</p>
        </div>
        
        <label for="portion-slider" style="font-size: 1.1rem; font-weight: bold;">
          Servings: <span id="portion-value">1.00</span>
        </label>
        <input type="range" id="portion-slider" min="0.25" max="5" step="0.25" value="1">
        
        <div class="modal-actions">
          <button id="btn-cancel-portion" class="secondary-btn">Cancel</button>
          <button id="btn-confirm-portion" class="primary-btn">Log Food</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
